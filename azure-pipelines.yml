# ==============================================================================
# AIONOS DEV ENVIRONMENT - AZURE DEVOPS CI/CD PIPELINE
# Modular Pipeline referencing Azure DevOps Library Variable Group 'eng-dev-vars'
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - 'environments/dev/**'
      - 'modules/**'

pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - 'environments/dev/**'
      - 'modules/**'

lockBehavior: sequential

variables:
  # Link to Azure DevOps Library Variable Group (Common prefix: eng-dev)
  - group: eng-dev-vars
  # Pipeline Execution Paths
  - name: WORKING_DIR
    value: '$(Build.SourcesDirectory)/environments/dev'

stages:
  # ============================================================================
  # STAGE 1: VALIDATE (Formatting & Syntax Validation)
  # ============================================================================
  - stage: Validate
    displayName: '🔍 Validate — eng-dev Environment'
    jobs:
      - job: Validate
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                TF_VERSION='$(TF_VERSION)'
                INSTALL_DIR="$(Agent.TempDirectory)/terraform-${TF_VERSION}"
                mkdir -p "$INSTALL_DIR"
                ZIP="$(Agent.TempDirectory)/terraform_${TF_VERSION}_linux_amd64.zip"
                curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o "$ZIP"
                unzip -qo "$ZIP" -d "$INSTALL_DIR"
                chmod +x "$INSTALL_DIR/terraform"
                export PATH="$INSTALL_DIR:$PATH"
                echo "##vso[task.prependpath]$INSTALL_DIR"
                "$INSTALL_DIR/terraform" version

          - task: CmdLine@2
            displayName: 'Terraform Format Check'
            inputs:
              script: |
                terraform fmt -check -recursive $(WORKING_DIR)

          - task: CmdLine@2
            displayName: 'Terraform Init (Local) & Validate'
            inputs:
              script: |
                set -euo pipefail
                cd "$(WORKING_DIR)"
                terraform init -backend=false
                terraform validate

  # ============================================================================
  # STAGE 2: PLAN (Generate Execution Plan & Remote State Sync)
  # ============================================================================
  - stage: Plan
    displayName: '📋 Plan — eng-dev Environment'
    dependsOn: Validate
    jobs:
      - job: Plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                TF_VERSION='$(TF_VERSION)'
                INSTALL_DIR="$(Agent.TempDirectory)/terraform-${TF_VERSION}"
                mkdir -p "$INSTALL_DIR"
                ZIP="$(Agent.TempDirectory)/terraform_${TF_VERSION}_linux_amd64.zip"
                curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o "$ZIP"
                unzip -qo "$ZIP" -d "$INSTALL_DIR"
                chmod +x "$INSTALL_DIR/terraform"
                export PATH="$INSTALL_DIR:$PATH"
                echo "##vso[task.prependpath]$INSTALL_DIR"
                "$INSTALL_DIR/terraform" version

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan (OIDC Authentication)'
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              addSpnToEnvironment: true
              workingDirectory: $(WORKING_DIR)
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RG)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)" \
                  -backend-config="use_oidc=true" \
                  -backend-config="use_azuread_auth=true"

                terraform plan -no-color -out=eng-dev.tfplan

          - task: Bash@3
            displayName: 'Clean .terraform Cache before publishing'
            inputs:
              targetType: inline
              script: |
                rm -rf "$(WORKING_DIR)/.terraform"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Artifact'
            inputs:
              targetPath: '$(WORKING_DIR)'
              artifact: eng-dev-plan

  # ============================================================================
  # STAGE 3: APPLY (Deployment with Approval & Automated Lock Recovery)
  # ============================================================================
  - stage: Apply
    displayName: '🚀 Apply — eng-dev Environment'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyDev
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'eng-us-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  displayName: 'Install Terraform $(TF_VERSION)'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      TF_VERSION='$(TF_VERSION)'
                      INSTALL_DIR="$(Agent.TempDirectory)/terraform-${TF_VERSION}"
                      mkdir -p "$INSTALL_DIR"
                      ZIP="$(Agent.TempDirectory)/terraform_${TF_VERSION}_linux_amd64.zip"
                      curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o "$ZIP"
                      unzip -qo "$ZIP" -d "$INSTALL_DIR"
                      chmod +x "$INSTALL_DIR/terraform"
                      export PATH="$INSTALL_DIR:$PATH"
                      echo "##vso[task.prependpath]$INSTALL_DIR"
                      "$INSTALL_DIR/terraform" version

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Plan Artifact'
                  inputs:
                    artifact: eng-dev-plan
                    path: $(WORKING_DIR)

                - task: AzureCLI@2
                  displayName: 'Terraform Apply (OIDC Authentication)'
                  inputs:
                    azureSubscription: '$(SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    addSpnToEnvironment: true
                    workingDirectory: $(WORKING_DIR)
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_OIDC_TOKEN=$idToken
                      export ARM_USE_OIDC=true
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      # Lock Recovery Helper for Stale State Locks (> 15 min)
                      run_fresh_plan_and_apply_with_lock_recovery() {
                        local out rc lock_id lock_age_secs
                        rm -f dev.apply.tfplan
                        set +e
                        out="$(terraform plan -no-color -lock-timeout=2m -out=dev.apply.tfplan 2>&1)"
                        rc=$?
                        set -e
                        if [[ $rc -eq 0 ]]; then
                          echo "$out"
                          terraform apply -no-color -lock-timeout=2m -auto-approve dev.apply.tfplan
                          return 0
                        fi
                        echo "$out" >&2
                        if ! grep -q "Error acquiring the state lock" <<<"$out"; then
                          return $rc
                        fi

                        lock_id="$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*ID:[[:space:]]*//p' | head -n1 | tr -d '\r')"
                        lock_age_secs="$(LOCK_INFO_TEXT="$out" python3 -c "import os,re,datetime; txt=os.environ.get('LOCK_INFO_TEXT',''); m=re.search(r'^\s*Created:\s*(.+)$', txt, re.M); raw=(m.group(1).strip() if m else None); raw=(re.sub(r'\s+UTC$','',raw).replace(' +0000','+00:00') if raw else None); raw=(re.sub(r'(\.\d{6})\d*(\+00:00)$', r'\1\2', raw) if raw else None); created=(datetime.datetime.fromisoformat(raw) if raw else None); now=datetime.datetime.now(datetime.timezone.utc); print(int((now-created).total_seconds()) if created else -1)")"
                        
                        if [[ -n "$lock_id" && "$lock_age_secs" -gt 900 ]]; then
                          echo "Stale state lock detected (id=${lock_id}, age_seconds=${lock_age_secs}); force-unlocking..."
                          terraform force-unlock -force "$lock_id"
                          terraform plan -no-color -lock-timeout=2m -out=dev.apply.tfplan
                          terraform apply -no-color -lock-timeout=2m -auto-approve dev.apply.tfplan
                        else
                          echo "##vso[task.logissue type=error]State lock active (id=${lock_id:-unknown})."
                          return $rc
                        fi
                      }

                      terraform init \
                        -backend-config="resource_group_name=$(BACKEND_RG)" \
                        -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(BACKEND_CONTAINER)" \
                        -backend-config="key=$(BACKEND_KEY)" \
                        -backend-config="use_oidc=true" \
                        -backend-config="use_azuread_auth=true" \
                        -lockfile=readonly

                      run_fresh_plan_and_apply_with_lock_recovery

  # ============================================================================
  # STAGE 4: DRIFT DETECT (Scheduled Nightly Infrastructure Drift Check)
  # ============================================================================
  - stage: DriftDetect
    displayName: '🔄 Nightly Infrastructure Drift Detection'
    dependsOn: []
    condition: eq(variables['Build.Reason'], 'Schedule')
    jobs:
      - job: DriftDetect
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                TF_VERSION='$(TF_VERSION)'
                INSTALL_DIR="$(Agent.TempDirectory)/terraform-${TF_VERSION}"
                mkdir -p "$INSTALL_DIR"
                ZIP="$(Agent.TempDirectory)/terraform_${TF_VERSION}_linux_amd64.zip"
                curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o "$ZIP"
                unzip -qo "$ZIP" -d "$INSTALL_DIR"
                chmod +x "$INSTALL_DIR/terraform"
                export PATH="$INSTALL_DIR:$PATH"
                echo "##vso[task.prependpath]$INSTALL_DIR"

          - task: AzureCLI@2
            displayName: 'Terraform Plan -detailed-exitcode (Drift Check)'
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              addSpnToEnvironment: true
              workingDirectory: $(WORKING_DIR)
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -backend-config="resource_group_name=$(BACKEND_RG)" \
                  -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(BACKEND_CONTAINER)" \
                  -backend-config="key=$(BACKEND_KEY)" \
                  -backend-config="use_oidc=true" \
                  -backend-config="use_azuread_auth=true"

                set +e
                terraform plan -detailed-exitcode -no-color
                TF_EXIT=$?
                set -e

                if [ "$TF_EXIT" -eq 2 ]; then
                  echo "##vso[task.logissue type=warning]DRIFT DETECTED in eng-dev Infrastructure!"
                elif [ "$TF_EXIT" -ne 0 ]; then
                  echo "##vso[task.logissue type=error]Drift plan failed with exit code $TF_EXIT"
                  exit $TF_EXIT
                fi

schedules:
  - cron: "0 6 * * *"
    displayName: 'Nightly Drift Detection — eng-dev'
    branches:
      include:
        - main
        - master
    always: true
